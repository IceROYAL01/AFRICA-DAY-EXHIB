    ];

    // Local Web Audio Frequency Synthesizer Core
    let audioCtx = null;
    function playBeep(freq = 1000, duration = 0.05, vol = 0.05, type = 'sine') {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playFlySound() {
      playBeep(240, 0.4, 0.15, 'sawtooth');
      setTimeout(() => playBeep(90, 0.3, 0.3, 'sine'), 150);
    }

    // Initialize Procedural Tactical Globe (No Web Textures Needed)
    const container = document.getElementById('globe-container');
    const world = Globe()(container)
      .backgroundColor('#010308')
      .globeColor('#071124')          // Solid high-tech vector dark blue baseline
      .showAtmosphere(true)
      .atmosphereColor('#00f0ff')
      .atmosphereAltitude(0.16)
      .showGraticules(true);          // Procedural longitude/latitude layout lines mapped directly

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.3;
    world.controls().enableZoom = true;

    // Inject Vector Pulse Array Points onto coordinates
    world.ringsData(sectors)
      .ringLat(d => d.lat)
      .ringLng(d => d.lng)
      .ringColor(() => '#00f0ff')
      .ringMaxRadius(7)
      .ringPropagationSpeed(1.5)
      .ringRepeatPeriod(1200);

    // Build Input Selection Interface Matrix
    function renderMacroGrid(filter = "") {
      const grid = document.getElementById('macro-grid');
      grid.innerHTML = "";
      
      sectors.forEach(s => {
        if (filter && !s.name.toLowerCase().includes(filter.toLowerCase())) return;

        const key = document.createElement('div');
        key.className = 'macro-key';
        key.innerText = `[${s.name.toUpperCase()}]`;
        key.setAttribute('data-sector', s.name);

        key.onclick = () => {
          document.querySelectorAll('.macro-key').forEach(k => k.classList.remove('active-lock'));
          key.classList.add('active-lock');
          executeTacticalDive(s);
        };
        grid.appendChild(key);
      });
    }

    let printTimeouts = [];
    function runTypewriterHUD(elementId, dataString) {
      const el = document.getElementById(elementId);
      el.textContent = "";
      let idx = 0;
      function write() {
        if (idx < dataString.length) {
          el.textContent += dataString.charAt(idx);
          if (idx % 4 === 0) playBeep(2800 + Math.random() * 400, 0.008, 0.01);
          idx++;
          let t = setTimeout(write, 8);
          printTimeouts.push(t);
        }
      }
      write();
    }

    // Camera Flight Execution Logic
    function executeTacticalDive(sector) {
      // Initialize audio on first physical key trigger event
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      
      playBeep(1200, 0.08, 0.1);
      world.controls().autoRotate = false;

      // Reset panels during transit phase
      printTimeouts.forEach(clearTimeout);
      printTimeouts = [];
      
      const panel = document.getElementById('intel-panel');
      const statusIndicator = document.getElementById('scan-indicator');
      panel.classList.add('active');
      statusIndicator.innerText = "APPROACHING SECTOR...";
      statusIndicator.style.background = "#ff0055";

      // Clear layout fields to maintain security locks
      ['m-name', 'm-capital', 'm-pop', 'm-area', 'm-gdp', 'm-lang', 'm-currency', 'm-brief'].forEach(id => {
        document.getElementById(id).innerText = "--";
      });

      // Execute Smooth Dive to ultra-close boundary altitude
      const FLIGHT_DURATION = 2400;
      world.pointOfView({ lat: sector.lat, lng: sector.lng, altitude: 0.25 }, FLIGHT_DURATION);
      playFlySound();

      // Trigger metric printout strictly on arrival
      setTimeout(() => {
        playBeep(880, 0.2, 0.15);
        statusIndicator.innerText = "BORDER LOCKED";
        statusIndicator.style.background = "#00ff66";

        runTypewriterHUD('m-name', sector.name.toUpperCase());
        runTypewriterHUD('m-capital', sector.cap.toUpperCase());
        runTypewriterHUD('m-pop', sector.pop);
        runTypewriterHUD('m-area', sector.area);
        runTypewriterHUD('m-gdp', sector.gdp);
        runTypewriterHUD('m-lang', sector.lang.toUpperCase());
        runTypewriterHUD('m-currency', sector.cur.toUpperCase());
        
        document.getElementById('m-brief').innerText = `> REPORT INTEL: ${sector.fact}`;
      }, FLIGHT_DURATION);
    }

    // Structural Filter Input Tracking
    document.getElementById('matrix-search').addEventListener('input', (e) => {
      renderMacroGrid(e.target.value);
    });

    // Reset Velocity Controls
    document.getElementById('system-reset').addEventListener('click', () => {
      printTimeouts.forEach(clearTimeout);
      printTimeouts = [];
      document.querySelectorAll('.macro-key').forEach(k => k.classList.remove('active-lock'));
      document.getElementById('intel-panel').classList.remove('active');
      document.getElementById('matrix-search').value = "";
      renderMacroGrid();
      
      world.controls().autoRotate = true;
      world.pointOfView({ lat: 5.0, lng: 18.0, altitude: 2.3 }, 1200);
      playBeep(450, 0.2, 0.05);
    });

    // Track Pointer Coordinates
    window.addEventListener('mousemove', (e) => {
      const lat = ((e.clientY / window.innerHeight) * -180 + 90).toFixed(4);
      const lng = ((e.clientX / window.innerWidth) * 360 - 180).toFixed(4);
      document.getElementById('hud-coordinates').innerText = `SYS.ORBITAL // LAT: ${lat}° | LNG: ${lng}°`;
    });

    // Initial Core Render Sequence
    renderMacroGrid();
    setTimeout(() => {
      world.pointOfView({ lat: 4.0, lng: 20.0, altitude: 2.3 }, 1500);
    }, 300);

    window.addEventListener('resize', () => {
      world.width(window.innerWidth); world.height(window.innerHeight);
    });
  </script>
</body>
</html>
